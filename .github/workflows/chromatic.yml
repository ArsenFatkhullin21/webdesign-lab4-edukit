# Визуальное регрессионное тестирование: при каждом push Chromatic снимает скриншоты
# всех stories и сравнивает с базовой версией. Нужен секрет CHROMATIC_TOKEN в настройках репозитория.
name: Chromatic
on: push
jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Chromatic нужна вся история git, чтобы найти базовую сборку
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run tokens
      - run: npx chromatic --project-token=${{ secrets.CHROMATIC_TOKEN }}
